name: CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: Install dependencies
        run: npm install
      
      - name: Run tests
        run: npm test
  
  output:
    name: Make Output
    runs-on: ubuntu-latest
    outputs:
      version-number: ${{steps.set-version.outputs.version}}
    steps:
      - id: set-version
        run: echo "version=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
    
  echo:
    needs: output
    runs-on: ubuntu-latest
    steps:
      - name: echo version
        run: echo "Version ${{ needs.output.outputs.version-number }}"